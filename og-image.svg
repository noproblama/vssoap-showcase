  <text x="404" y="358"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="62"
    fill="#2a2018"
    font-style="italic">із власноруч</text>

  <text x="404" y="432"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="62"
    fill="#2a2018">зібраних трав</text>

  <!-- Description -->
  <text x="404" y="488"
    font-family="Arial, Helvetica, sans-serif"
    font-size="16"
    fill="#a89e8e">Холодне омилення · від 6 тижнів витримки · натуральні ефірні олії</text>

  <!-- Separator + URL -->
  <line x1="404" y1="528" x2="472" y2="528" stroke="#8a9c78" stroke-width="2"/>
  <text x="484" y="533"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13"
    fill="#b4a898"
    dy="2">vssoap.com.ua</text>

  <!-- ── Decorative circle cluster top-right ── -->
  <g opacity="0.10" fill="#7a6a4a">
    <circle cx="1148" cy="52" r="58"/>
    <circle cx="1190" cy="90" r="40"/>
    <circle cx="1112" cy="105" r="32"/>
    <circle cx="1175" cy="22" r="22"/>
  </g>

  <!-- ── Top & bottom accent lines ── -->
  <rect width="1200" height="5" fill="#5a6b4a" opacity="0.55"/>
  <rect y="625" width="1200" height="5" fill="#5a6b4a" opacity="0.55"/>

</svg>

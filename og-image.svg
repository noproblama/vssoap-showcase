<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">

  <!-- ── Background ── -->
  <rect width="1200" height="630" fill="#F2E9D8"/>

  <!-- ── Left sage panel ── -->
  <rect width="360" height="630" fill="#4a5740"/>

  <!-- ── Botanical branch decoration on left panel ── -->
  <g fill="#b8cca4" opacity="0.22">
    <!-- Stem -->
    <path d="M 182,10 Q 176,200 182,410 Q 185,510 179,622" stroke="#b8cca4" stroke-width="1.5" fill="none" opacity="0.5"/>
    <!-- Leaf pairs top-to-bottom -->
    <path d="M 181,75  Q 132,50  110,84  Q 143,106 181,90  Z"/>
    <path d="M 183,75  Q 234,50  256,84  Q 223,106 183,90  Z"/>

    <path d="M 181,155 Q 126,128 103,165 Q 138,188 181,170 Z"/>
    <path d="M 183,155 Q 240,128 263,165 Q 228,188 183,170 Z"/>

    <path d="M 181,235 Q 130,208 108,245 Q 143,268 181,250 Z"/>
    <path d="M 183,235 Q 236,208 258,245 Q 223,268 183,250 Z"/>

    <path d="M 181,430 Q 130,403 108,440 Q 143,463 181,445 Z"/>
    <path d="M 183,430 Q 236,403 258,440 Q 223,463 183,445 Z"/>

    <path d="M 181,510 Q 128,482 105,520 Q 142,544 181,526 Z"/>
    <path d="M 183,510 Q 238,482 261,520 Q 224,544 183,526 Z"/>

    <path d="M 181,585 Q 130,558 108,595 Q 143,617 181,600 Z"/>
    <path d="M 183,585 Q 236,558 258,595 Q 223,617 183,600 Z"/>
  </g>

  <!-- ── VS Soap logo on left panel ── -->
  <text x="182" y="322"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="84"
    fill="white"
    text-anchor="middle"
    font-style="italic"
    opacity="0.95">VS</text>

  <line x1="118" y1="340" x2="246" y2="340" stroke="rgba(255,255,255,0.30)" stroke-width="1"/>

  <text x="182" y="372"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="21"
    fill="white"
    text-anchor="middle"
    letter-spacing="11"
    opacity="0.75">soap</text>

  <text x="182" y="406"
    font-family="Arial, Helvetica, sans-serif"
    font-size="10"
    fill="rgba(255,255,255,0.45)"
    text-anchor="middle"
    letter-spacing="3.5">ЧЕРКАЩИНА</text>

  <!-- ── Right side content ── -->

  <!-- Eyebrow -->
  <text x="404" y="194"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    fill="#7a8c68"
    letter-spacing="4"
    font-weight="600">КРАФТОВЕ МИЛО РУЧНОЇ РОБОТИ</text>

  <line x1="404" y1="208" x2="464" y2="208" stroke="#8a9c78" stroke-width="1.5" opacity="0.7"/>

  <!-- Main heading -->
  <text x="404" y="284"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="62"
